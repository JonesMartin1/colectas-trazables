name: Revisar secretos

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Revisar commits nuevos
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node scripts/check-secrets.js --range "$PR_BASE..$PR_HEAD"
          elif [ "$PUSH_BASE" = "0000000000000000000000000000000000000000" ]; then
            node scripts/check-secrets.js --tracked
          else
            node scripts/check-secrets.js --range "$PUSH_BASE..$PUSH_HEAD"
          fi
