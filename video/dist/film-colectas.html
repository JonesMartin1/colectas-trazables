<script>
// ---- src\props.js
/*
 * props.js : the shared doodle props and primitives for photo-doodle films, drawn once here so
 * every shot draws them identically. Loaded after lib.js and before the scenes.
 *
 * Everything is a pure function of its arguments (no state between frames) and every stroke goes
 * through FILM.lib.inkPath, so the boil and the draw-on behave like the rest of the film.
 *
 *   props:       bubble, sparkle, speedLines, starburst, cloud, sun, moon, heart, note, flag,
 *                trail, zzz, dust, drop (see each function's comment)
 *   primitives:  step (stroke i of n from a figure's draw fraction), place (translate/scale/flip),
 *                ink, wash, eye, blush, blob — what src/cast.js builds its characters from
 *
 * The film's own characters live in src/cast.js and call these. Keep them out of scene files: a
 * character redrawn per scene drifts, and sixteen agents will each drift differently.
 *
 * Draw-on: every function takes draw 0..1 and reveals its strokes in order, each stroke taking
 * 1/n of the range with a small overlap, so a figure assembles the way a hand would draw it.
 * Night shots pass night: true, which swaps ink for chalk and drops the pigment.
 */
(function () {
  'use strict';

  const FILM = window.FILM;
  const L = FILM.lib;
  const P = L.pal;
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);

  /** progress of stroke i of n, given the whole-figure draw fraction */
  const step = (d, i, n) => clamp((d * n - i) * 1.35);

  /** rotate + scale helper: maps local coords (x right, y down, origin at the figure's base) */
  function place(ctx, o, fn) {
    ctx.save();
    ctx.translate(o.x, o.y);
    if (o.tilt) ctx.rotate(o.tilt);
    const s = o.s != null ? o.s : 1;
    ctx.scale(o.flip ? -s : s, s);
    fn();
    ctx.restore();
  }

  const inkOf = (o) => (o.night ? P.chalk : P.doodleInk);

  function ink(ctx, pts, o, extra) {
    // o.alpha applies to the whole figure; extra.alpha (per stroke) multiplies it.
    const base = { color: inkOf(o), width: 3.4, wobble: 1.6, tremble: 0.4 };
    const q = Object.assign(base, extra);
    if (o.alpha != null) q.alpha = (q.alpha != null ? q.alpha : 1) * o.alpha;
    L.inkPath(ctx, pts, q);
  }

  function wash(ctx, pts, o, color, extra) {
    if (o.night) return; // night shots are chalk line only, no pigment
    L.wash(ctx, pts, Object.assign({ color, alpha: 0.5, seed: (extra && extra.seed) || 7 }, extra));
  }

  /** a closed blob path: centre, radius, per-angle radius function */
  function blob(cx, cy, n, rf) {
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU;
      const r = rf(a, i);
      pts.push([cx + Math.cos(a) * r[0], cy + Math.sin(a) * r[1]]);
    }
    return pts;
  }

  const eye = (ctx, x, y, r, o, blink) => {
    if (blink > 0.5) ink(ctx, [[x - r * 1.3, y], [x + r * 1.3, y]], o, { width: 2.6, smooth: false, taper: 3 });
    else {
      ctx.save();
      ctx.fillStyle = inkOf(o);
      ctx.beginPath();
      ctx.ellipse(x, y, r, r * 1.08, 0, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
  };

  const blush = (ctx, x, y, r, o) => {
    if (o.night) return;
    ctx.save();
    ctx.globalAlpha *= 0.55;
    ctx.fillStyle = P.blush;
    ctx.beginPath();
    ctx.ellipse(x, y, r, r * 0.68, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  };

  // ---------------------------------------------------------------------------
  // Props
  // ---------------------------------------------------------------------------

  /** bubble(ctx, o) : speech bubble with a tail. x, y is the bubble centre; tail points at tx, ty. */
  function bubble(ctx, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const w = o.w || 200, h = o.h || 110;
    const pts = blob(o.x, o.y, 34, (a) => [w / 2 + Math.cos(a * 3) * 5, h / 2 + Math.sin(a * 2) * 4]);
    if (!o.night) {
      L.wash(ctx, pts, { color: o.fill || P.washCream, alpha: o.fillAlpha != null ? o.fillAlpha : 0.75, p: d, seed: (o.seed || 5) + 1, offset: [2, 2], edge: 0 });
    }
    ink(ctx, pts, o, { closed: true, draw: d, width: 3, seed: o.seed || 5 });
    if (o.tx != null) {
      const dx = o.tx - o.x, dy = o.ty - o.y;
      const l = Math.hypot(dx, dy) || 1;
      const bx = o.x + (dx / l) * (w / 2) * 0.8, by = o.y + (dy / l) * (h / 2) * 0.9;
      ink(ctx, [[bx - 14, by - 2], [o.tx, o.ty], [bx + 12, by + 8]], o, { draw: d, width: 2.8, seed: (o.seed || 5) + 2 });
    }
    if (o.label && d > 0.85) {
      L.hand(ctx, o.label, o.x, o.y + (o.size || 42) * 0.34, {
        size: o.size || 42,
        align: 'center',
        color: inkOf(o),
        p: clamp((d - 0.85) / 0.15),
      });
    }
  }

  /** sparkle(ctx, x, y, r, o) : a four-point twinkle. */
  function sparkle(ctx, x, y, r, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    if (d <= 0) return;
    const k = r * d;
    ink(ctx, [[x - k, y], [x + k, y]], o, { width: o.width || 2.4, seed: (o.seed || 3) });
    ink(ctx, [[x, y - k], [x, y + k]], o, { width: o.width || 2.4, seed: (o.seed || 3) + 1 });
    ink(ctx, [[x - k * 0.45, y - k * 0.45], [x + k * 0.45, y + k * 0.45]], o, { width: (o.width || 2.4) * 0.7, seed: (o.seed || 3) + 2 });
    ink(ctx, [[x + k * 0.45, y - k * 0.45], [x - k * 0.45, y + k * 0.45]], o, { width: (o.width || 2.4) * 0.7, seed: (o.seed || 3) + 3 });
  }

  /** speedLines(ctx, o) : n trailing lines behind something moving. x, y is the trailing edge. */
  function speedLines(ctx, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const n = o.n || 3, len = o.len || 90, gap = o.gap || 22, dir = o.dir != null ? o.dir : -1;
    for (let i = 0; i < n; i++) {
      const y = o.y + (i - (n - 1) / 2) * gap;
      const l = len * (i === Math.floor(n / 2) ? 1 : 0.7);
      ink(ctx, [[o.x, y], [o.x + dir * l, y + (i - (n - 1) / 2) * 4]], o, {
        draw: clamp(d * 1.4 - i * 0.12),
        width: o.width || 3,
        seed: (o.seed || 40) + i,
        smooth: false,
      });
    }
  }

  /** starburst(ctx, x, y, r, o) : the impact star behind a loud moment. */
  function starburst(ctx, x, y, r, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    if (d <= 0) return;
    const n = o.n || 10;
    const pts = [];
    for (let i = 0; i < n * 2; i++) {
      const a = (i / (n * 2)) * TAU - Math.PI / 2;
      const rr = (i % 2 ? r * 0.52 : r) * (0.9 + 0.2 * Math.sin(i * 2.7 + (o.seed || 1)));
      pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]);
    }
    if (!o.night && o.fill !== false) L.wash(ctx, pts, { color: o.fill || P.washYellow, alpha: 0.45, p: d, seed: (o.seed || 9) + 4, offset: [3, 2] });
    ink(ctx, pts, o, { closed: true, draw: d, width: o.width || 3.4, seed: o.seed || 9 });
  }

  /** cloud(ctx, x, y, w, o) : a bumpy cloud. o.face: 'angry' | 'happy' draws a face on it. */
  function cloud(ctx, x, y, w, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const h = o.h || w * 0.46;
    const pts = [];
    const bumps = o.bumps || 5;
    for (let i = 0; i <= 44; i++) {
      const u = i / 44, a = u * TAU;
      const r = 1 + 0.16 * Math.cos(a * bumps + (o.seed || 2));
      pts.push([x + Math.cos(a) * (w / 2) * r, y + Math.sin(a) * (h / 2) * (a > Math.PI ? r : r * 0.82)]);
    }
    if (!o.night) L.wash(ctx, pts, { color: o.fill || P.washBlue, alpha: o.fillAlpha != null ? o.fillAlpha : 0.35, p: d, seed: (o.seed || 2) + 1 });
    ink(ctx, pts, o, { closed: true, draw: d, width: o.width || 3.2, seed: o.seed || 2 });
    if (o.face && d > 0.9) {
      const ey = y - h * 0.05;
      eye(ctx, x - w * 0.12, ey, 4.6, o, o.blink || 0);
      eye(ctx, x + w * 0.12, ey, 4.6, o, o.blink || 0);
      const m = o.face === 'angry'
        ? [[x - w * 0.1, y + h * 0.2], [x, y + h * 0.12], [x + w * 0.1, y + h * 0.2]]
        : [[x - w * 0.1, y + h * 0.12], [x, y + h * 0.24], [x + w * 0.1, y + h * 0.12]];
      ink(ctx, m, o, { width: 2.4, seed: (o.seed || 2) + 6 });
      if (o.face === 'angry') {
        ink(ctx, [[x - w * 0.2, ey - 16], [x - w * 0.06, ey - 8]], o, { width: 2.4, seed: (o.seed || 2) + 7 });
        ink(ctx, [[x + w * 0.2, ey - 16], [x + w * 0.06, ey - 8]], o, { width: 2.4, seed: (o.seed || 2) + 8 });
      }
    }
  }

  /** sun(ctx, x, y, r, o) / moon(ctx, x, y, r, o) : with rays / with a sleepy face. */
  function sun(ctx, x, y, r, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const disc = blob(x, y, 30, () => [r, r]);
    if (!o.night) L.wash(ctx, disc, { color: o.fill || P.washYellow, alpha: 0.5, p: d, seed: (o.seed || 11) + 1 });
    ink(ctx, disc, o, { closed: true, draw: d, width: 3.2, seed: o.seed || 11 });
    const n = o.rays == null ? 8 : o.rays;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + (o.rot || 0);
      ink(ctx, [[x + Math.cos(a) * r * 1.25, y + Math.sin(a) * r * 1.25], [x + Math.cos(a) * r * 1.6, y + Math.sin(a) * r * 1.6]], o, {
        draw: clamp(d * 1.3 - i * 0.05),
        width: 2.6,
        seed: (o.seed || 11) + 3 + i,
        smooth: false,
      });
    }
    if (o.face && d > 0.9) {
      eye(ctx, x - r * 0.3, y - r * 0.1, 4.4, o, o.blink || (o.face === 'sleep' ? 1 : 0));
      eye(ctx, x + r * 0.3, y - r * 0.1, 4.4, o, o.blink || (o.face === 'sleep' ? 1 : 0));
      ink(ctx, [[x - r * 0.18, y + r * 0.26], [x, y + r * 0.38], [x + r * 0.18, y + r * 0.26]], o, { width: 2.4, seed: (o.seed || 11) + 20 });
    }
  }

  function moon(ctx, x, y, r, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const pts = [];
    for (let i = 0; i <= 40; i++) {
      const a = -Math.PI * 0.62 + (i / 40) * Math.PI * 1.24;
      pts.push([x + Math.cos(a) * r, y + Math.sin(a) * r]);
    }
    for (let i = 40; i >= 0; i--) {
      const a = -Math.PI * 0.62 + (i / 40) * Math.PI * 1.24;
      pts.push([x + Math.cos(a) * r * 0.42 + r * 0.42, y + Math.sin(a) * r * 0.92]);
    }
    if (!o.night) L.wash(ctx, pts, { color: o.fill || P.washCream, alpha: 0.5, p: d, seed: (o.seed || 13) + 1 });
    ink(ctx, pts, o, { closed: true, draw: d, width: 3.2, seed: o.seed || 13 });
    if (o.face && d > 0.9) {
      eye(ctx, x - r * 0.28, y - r * 0.08, 4.2, o, 1);
      ink(ctx, [[x - r * 0.34, y + r * 0.3], [x - r * 0.18, y + r * 0.4], [x - r * 0.02, y + r * 0.3]], o, { width: 2.2, seed: (o.seed || 13) + 6 });
    }
  }

  /** heart(ctx, x, y, r, o) and note(ctx, x, y, s, o) : the two little feeling glyphs. */
  function heart(ctx, x, y, r, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const pts = [];
    for (let i = 0; i <= 48; i++) {
      const a = (i / 48) * TAU;
      const sx = 16 * Math.pow(Math.sin(a), 3);
      const sy = 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a);
      pts.push([x + (sx / 16) * r, y - (sy / 16) * r]);
    }
    if (!o.night) L.wash(ctx, pts, { color: o.fill || P.washPink, alpha: 0.55, p: d, seed: (o.seed || 17) + 1 });
    ink(ctx, pts, o, { closed: true, draw: d, width: o.width || 2.8, seed: o.seed || 17 });
  }

  function note(ctx, x, y, s = 1, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const head = blob(x, y, 20, () => [11 * s, 8.5 * s]);
    if (!o.night) L.wash(ctx, head, { color: o.fill || P.washLilac, alpha: 0.55, p: d, seed: (o.seed || 19) + 1 });
    ink(ctx, head, o, { closed: true, draw: d, width: 2.6, seed: o.seed || 19 });
    ink(ctx, [[x + 10 * s, y - 2 * s], [x + 11 * s, y - 40 * s]], o, { draw: d, width: 2.6, seed: (o.seed || 19) + 2 });
    if (o.flag !== false) ink(ctx, [[x + 11 * s, y - 40 * s], [x + 26 * s, y - 30 * s], [x + 22 * s, y - 18 * s]], o, { draw: d, width: 2.4, seed: (o.seed || 19) + 3 });
  }

  /** flag(ctx, x, y, o) : a little pennant on a pole, y is the pole's foot. */
  function flag(ctx, x, y, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const h = o.h || 90;
    ink(ctx, [[x, y], [x - 2, y - h]], o, { draw: step(d, 0, 2), width: 3, seed: o.seed || 23 });
    const w = o.w || 62, wave = o.wave || 0;
    const pts = [
      [x - 2, y - h], [x + w * 0.5, y - h + 6 + wave], [x + w, y - h + 2 - wave],
      [x + w * 0.6, y - h + 30 + wave], [x - 2, y - h + 34],
    ];
    if (!o.night) L.wash(ctx, pts, { color: o.fill || P.washRed, alpha: 0.5, p: step(d, 1, 2), seed: (o.seed || 23) + 1 });
    ink(ctx, pts, o, { closed: true, draw: step(d, 1, 2), width: 2.8, seed: (o.seed || 23) + 2 });
  }

  /** trail(ctx, pts, o) : a travelling character's trail — a double line with sparkles along it. */
  function trail(ctx, pts, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    if (d <= 0 || !pts || pts.length < 2) return;
    ink(ctx, pts, o, { draw: d, width: o.width || 2.6, seed: o.seed || 29, alpha: o.alpha != null ? o.alpha : 0.75 });
    const off = pts.map(([x, y]) => [x, y + (o.gap || 9)]);
    ink(ctx, off, o, { draw: clamp(d * 1.1 - 0.08), width: (o.width || 2.6) * 0.8, seed: (o.seed || 29) + 1, alpha: (o.alpha != null ? o.alpha : 0.75) * 0.8 });
    const n = o.sparkles == null ? 3 : o.sparkles;
    for (let i = 0; i < n; i++) {
      const u = (i + 0.5) / n;
      if (d < u) continue;
      const k = Math.min(pts.length - 1, Math.floor(u * (pts.length - 1)));
      sparkle(ctx, pts[k][0], pts[k][1] - 14, 9, { seed: (o.seed || 29) + 5 + i, night: o.night, width: 1.8 });
    }
  }

  /** zzz(ctx, o) : three sleeping z's rising. */
  function zzz(ctx, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const s = o.s || 1;
    for (let i = 0; i < 3; i++) {
      const p = clamp(d * 3 - i);
      if (p <= 0) continue;
      const k = (26 - i * 6) * s;
      const x = o.x + i * 26 * s, y = o.y - i * 34 * s;
      ink(ctx, [[x, y], [x + k, y], [x, y + k], [x + k, y + k]], o, { draw: p, width: 2.6, smooth: false, seed: (o.seed || 31) + i });
    }
  }

  /** dust(ctx, x, y, o) : a puff of motion dust at the ground. */
  function dust(ctx, x, y, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const n = o.n || 3;
    for (let i = 0; i < n; i++) {
      const a = Math.PI + (i / (n - 1 || 1)) * Math.PI;
      const r = (o.r || 18) * (0.7 + 0.3 * Math.cos(i * 2.1));
      cloud(ctx, x + Math.cos(a) * (o.spread || 34), y + Math.sin(a) * 10, r * 2, {
        draw: clamp(d * 1.3 - i * 0.1),
        night: o.night,
        seed: (o.seed || 37) + i,
        fill: o.fill || P.washCream,
        fillAlpha: 0.3,
        width: 2.4,
      });
    }
  }

  /** drop(ctx, x, y, r, o) : a raindrop / teardrop, point up. */
  function drop(ctx, x, y, r, o = {}) {
    const d = o.draw == null ? 1 : clamp(o.draw);
    const pts = [];
    for (let i = 0; i <= 30; i++) {
      const a = (i / 30) * TAU - Math.PI / 2;
      const rr = r * (1 - 0.45 * Math.cos(a)) * (a > Math.PI * 0.5 && a < Math.PI * 1.5 ? 1 : 1);
      pts.push([x + Math.cos(a) * rr * 0.72, y + Math.sin(a) * rr]);
    }
    if (!o.night) L.wash(ctx, pts, { color: o.fill || P.washBlue, alpha: 0.5, p: d, seed: (o.seed || 41) + 1 });
    ink(ctx, pts, o, { closed: true, draw: d, width: o.width || 2.4, seed: o.seed || 41 });
  }

  FILM.props = {
    bubble,
    sparkle,
    speedLines,
    starburst,
    cloud,
    sun,
    moon,
    heart,
    note,
    flag,
    trail,
    zzz,
    dust,
    drop,
    // primitives, for src/cast.js
    step,
    place,
    ink,
    wash,
    eye,
    blush,
    blob,
    inkOf,
  };
})();

</script>
<script>
// ---- src\cast.js
// Shared drawing pieces for this film (art bible 10, storyboard G1 and G2).
// The board and its clippings, the red strings, the phones and the progress glyph live here so
// every scene draws them identically. Everything is seeded from fixed keys and depends on t alone.
(function () {
  'use strict';
  const L = FILM.lib;
  const P = L.pal;
  const FR = 1 / 24;
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const SERIF = 'Georgia, "Times New Roman", serif';
  const SANS = '"Segoe UI", "Helvetica Neue", Arial, sans-serif';

  // ---------------------------------------------------------------------------
  // G1: the board (world coordinates 2400 x 4500) and its clippings
  // ---------------------------------------------------------------------------
  const BOARD = { w: 2400, h: 4500 };
  const CLIPS = [
    { id: 'C1', x: 540, y: 760, w: 880, rot: -0.035, at: -1, outlet: 'INFOBAE', date: '16/10/2026',
      head: 'El Niño: las aguas del Paraná ingresaron a la ciudad de Corrientes y la provincia suma más de 200 evacuados' },
    { id: 'C2', x: 1640, y: 820, w: 880, rot: 0.03, at: 2.0, outlet: 'LOS ANDES', date: '21/02/2022',
      head: 'Santi Maratea lo hizo otra vez: juntó más de 111 millones de pesos para combatir los incendios en Corrientes' },
    { id: 'C3', x: 540, y: 2050, w: 880, rot: 0.03, at: 4.0, outlet: 'LA GACETA', date: '2023',
      head: 'Por qué la colecta de Santiago Maratea para Independiente está en la mira de la AFIP' },
    { id: 'C4', x: 560, y: 2560, w: 860, rot: -0.025, at: 5.0, outlet: 'CORTA', date: '2023',
      head: 'Colecta de Santi Maratea: las 10 irregularidades que detectó la IGJ' },
    { id: 'C5', x: 1640, y: 2150, w: 880, rot: -0.02, at: 6.0, outlet: 'LA NACION', date: '18/02/2026',
      head: 'Santi Maratea se defendió de una denuncia por una de sus colectas' },
    { id: 'C6', x: 1150, y: 3200, w: 880, rot: 0.025, at: 8.0, outlet: 'CHEQUEADO', date: '2025',
      head: 'Inundaciones en Bahía Blanca: cuidado con los intentos de estafas al momento de hacer una transferencia' },
    { id: 'C7', x: 1250, y: 3720, w: 880, rot: -0.03, at: 9.0, outlet: 'LA REPÚBLICA', date: '01/07/2026',
      head: 'Autoridades de EE.UU. advierten posibles estafas en donaciones para Venezuela tras doble terremoto' },
  ];
  const BYID = {};
  for (const c of CLIPS) BYID[c.id] = c;

  // word wrap, measured once per (font, text, width) and cached
  const wrapCache = {};
  function wrap(ctx, str, font, maxW) {
    const key = font + '|' + maxW + '|' + str;
    if (wrapCache[key]) return wrapCache[key];
    ctx.save();
    ctx.font = font;
    const words = str.split(' ');
    const lines = [];
    let cur = '';
    for (const w of words) {
      const test = cur ? cur + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && cur) {
        lines.push(cur);
        cur = w;
      } else cur = test;
    }
    if (cur) lines.push(cur);
    const out = lines.map((s) => ({ s, w: ctx.measureText(s).width }));
    ctx.restore();
    wrapCache[key] = out;
    return out;
  }

  const HS = 58; // headline size
  const PAD = 34;
  function layout(ctx, c) {
    const font = `800 ${HS}px ${SERIF}`;
    const lines = wrap(ctx, c.head, font, c.w - PAD * 2);
    const lh = Math.round(HS * 1.14);
    const top = PAD + 46; // masthead row
    const headTop = top + 18;
    const bodyTop = headTop + lines.length * lh + 14;
    const h = bodyTop + 3 * 30 + PAD - 6;
    return { font, lines, lh, top, headTop, bodyTop, h };
  }

  // torn-edge outline, built once per clipping, t-independent
  function tornPts(c, w, h) {
    const key = 'torn|' + c.id + '|' + w + '|' + h;
    return L.cached(key, () => {
      const r = L.rng(L.hash('board', c.id, 'torn'));
      const pts = [];
      const step = 22;
      const j = (a) => (r() - 0.5) * a;
      for (let x = 0; x <= w; x += step) pts.push([x - w / 2 + j(2), -h / 2 + j(7)]);
      for (let y = step; y <= h; y += step) pts.push([w / 2 + j(7), y - h / 2 + j(2)]);
      for (let x = w - step; x >= 0; x -= step) pts.push([x - w / 2 + j(2), h / 2 + j(7)]);
      for (let y = h - step; y > 0; y -= step) pts.push([-w / 2 + j(7), y - h / 2 + j(2)]);
      return pts;
    });
  }

  function poly(ctx, pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
  }

  // slap-on scale: 1.12 at the paste frame, outBack to 1 over 3 frames
  function slapScale(T, at) {
    if (at < 0) return 1;
    const u = clamp((T - at) / (3 * FR) + 1 / 3);
    return 1 + 0.12 * (1 - L.ease.outBack(u));
  }

  /**
   * clipping(ctx, id, T, { greek }) draws clipping id in world coordinates, if it has been pasted by T.
   * Returns { lineBox(i) } giving a line's centre and width in world coordinates, or null when not pasted.
   */
  function clipping(ctx, id, T, o = {}) {
    const c = BYID[id];
    if (c.at >= 0 && T < c.at - 1e-6) return null;
    const lay = layout(ctx, c);
    const w = c.w, h = lay.h;
    const s = slapScale(T, c.at);
    const lift = (s - 1) / 0.12; // 1 at the paste frame
    const pts = tornPts(c, w, h);
    const bi = L.boil(T);
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.scale(s, s);
    // shadow
    ctx.save();
    ctx.translate(10 + lift * 16, 14 + lift * 22);
    poly(ctx, pts);
    ctx.fillStyle = L.rgba(P.kraftDeep, 0.55 - lift * 0.2);
    ctx.fill();
    ctx.restore();
    // paper
    poly(ctx, pts);
    ctx.fillStyle = P.newsprint;
    ctx.fill();
    // a faint shade band along the lower edge (light from the upper left)
    ctx.save();
    poly(ctx, pts);
    ctx.clip();
    ctx.fillStyle = L.rgba(P.newsprintShade, 0.55);
    ctx.fillRect(-w / 2, h / 2 - 26, w, 30);
    ctx.fillRect(w / 2 - 18, -h / 2, 20, h);
    ctx.restore();
    L.inkPath(ctx, pts, { closed: true, width: 1.6, color: P.inkSoft, alpha: 0.55, seed: L.hash('board', id, 'edge'), boil: bi, smooth: false });
    const x0 = -w / 2 + PAD;
    const greek = !!o.greek;
    // masthead
    if (greek) {
      ctx.fillStyle = L.rgba(P.headline, 0.75);
      ctx.fillRect(x0, -h / 2 + PAD + 8, 170, 20);
      ctx.fillStyle = L.rgba(P.greek, 0.9);
      ctx.fillRect(w / 2 - PAD - 120, -h / 2 + PAD + 12, 120, 12);
    } else {
      L.text(ctx, c.outlet, x0, -h / 2 + PAD + 26, { size: 26, weight: 800, color: P.headline, family: SANS, tracking: 3 });
      L.text(ctx, c.date, w / 2 - PAD, -h / 2 + PAD + 26, { size: 22, weight: 600, color: P.inkSoft, family: SANS, align: 'right' });
    }
    ctx.fillStyle = P.headline;
    ctx.fillRect(x0, -h / 2 + lay.top, w - PAD * 2, 2.5);
    // headline
    for (let i = 0; i < lay.lines.length; i++) {
      const ln = lay.lines[i];
      const by = -h / 2 + lay.headTop + (i + 1) * lay.lh - 12;
      if (greek) {
        ctx.fillStyle = L.rgba(P.headline, 0.8);
        ctx.fillRect(x0, by - HS * 0.62, ln.w, HS * 0.6);
      } else {
        L.text(ctx, ln.s, x0, by, { size: HS, weight: 800, color: P.headline, family: SERIF });
      }
    }
    // greeked body copy
    const r = L.rng(L.hash('board', id, 'body'));
    ctx.fillStyle = L.rgba(P.greek, 0.85);
    for (let k = 0; k < 3; k++) {
      const by = -h / 2 + lay.bodyTop + k * 30;
      const colW = (w - PAD * 2 - 24) / 2;
      ctx.fillRect(x0, by, colW * (0.82 + r() * 0.18), 11);
      ctx.fillRect(x0 + colW + 24, by, colW * (k === 2 ? 0.55 : 0.82 + r() * 0.18), 11);
    }
    // tape on the top corners, after the slap settles
    if (lift < 0.5) {
      for (const sx of [-1, 1]) {
        ctx.save();
        ctx.translate(sx * (w / 2 - 40), -h / 2 + 4);
        ctx.rotate(sx * 0.5 + (r() - 0.5) * 0.1);
        ctx.fillStyle = L.rgba(P.tape, 0.86);
        ctx.fillRect(-58, -18, 116, 36);
        ctx.fillStyle = L.rgba(P.newsprintShade, 0.6);
        ctx.fillRect(-58, -18, 116, 4);
        ctx.restore();
      }
    }
    // dust ticks for 6 frames after the slap
    if (c.at >= 0 && T >= c.at && T < c.at + 6 * FR) {
      const u = (T - c.at) / (6 * FR);
      for (let k = 0; k < 10; k++) {
        const a = (k / 10) * Math.PI * 2 + 0.3;
        const R0 = Math.max(w, h) * 0.52 + u * 40;
        const x1 = Math.cos(a) * R0 * (w / Math.max(w, h)), y1 = Math.sin(a) * R0 * (h / Math.max(w, h));
        L.inkLine(ctx, x1, y1, x1 * (1.06 + u * 0.08), y1 * (1.06 + u * 0.08), { width: 3, color: P.ink, alpha: 1 - u, seed: k + 7 });
      }
    }
    ctx.restore();
    const cs = Math.cos(c.rot), sn = Math.sin(c.rot);
    return {
      h,
      lineBox(i) {
        const ln = lay.lines[Math.min(i, lay.lines.length - 1)];
        const lx = x0 + ln.w / 2, ly = -h / 2 + lay.headTop + (i + 1) * lay.lh - 12 - HS * 0.33;
        return { x: c.x + lx * cs - ly * sn, y: c.y + lx * sn + ly * cs, w: ln.w, h: lay.lh, rot: c.rot };
      },
      lines: lay.lines.map((l) => l.s),
      top: { x: c.x + (h / 2) * sn, y: c.y - (h / 2) * cs },
    };
  }

  // kraft board under the current camera, with a fibre pattern tile
  function boardBase(ctx) {
    ctx.fillStyle = P.kraft;
    ctx.fillRect(-6000, -6000, BOARD.w + 12000, BOARD.h + 12000);
    const fib = L.cached('kraft-fibres', () => {
      const r = L.rng(L.hash('kraft', 'fibres'));
      const out = [];
      for (let i = 0; i < 2600; i++) out.push([r() * (BOARD.w + 1200) - 600, r() * (BOARD.h + 1200) - 600, 6 + r() * 22, r() * Math.PI, r()]);
      return out;
    });
    ctx.save();
    ctx.lineWidth = 1.4;
    for (let k = 0; k < 2; k++) {
      ctx.strokeStyle = L.rgba(k ? P.kraftDeep : P.paperShade, k ? 0.38 : 0.45);
      ctx.beginPath();
      for (let i = k; i < fib.length; i += 2) {
        const f = fib[i];
        const dx = Math.cos(f[3]) * f[2], dy = Math.sin(f[3]) * f[2] * 0.35;
        ctx.moveTo(f[0] - dx, f[1] - dy);
        ctx.lineTo(f[0] + dx, f[1] + dy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  function pin(ctx, x, y, s = 1) {
    ctx.save();
    ctx.fillStyle = L.rgba(P.ink, 0.25);
    ctx.beginPath();
    ctx.ellipse(x + 6 * s, y + 9 * s, 15 * s, 10 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = P.pinRed;
    ctx.beginPath();
    ctx.arc(x, y, 15 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = L.rgba(P.white, 0.7);
    ctx.beginPath();
    ctx.arc(x - 5 * s, y - 5 * s, 4.5 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    L.inkCircle(ctx, x, y, 15 * s, { width: 2, color: P.ink, alpha: 0.8, seed: Math.round(x + y) });
  }

  /** The whole board at time T under camera cam; focus = ids that draw real text. Returns the clip handles. */
  function board(ctx, T, cam, focus) {
    const out = {};
    L.camera(ctx, cam, () => {
      boardBase(ctx);
      for (const c of CLIPS) {
        out[c.id] = clipping(ctx, c.id, T, { greek: !focus.includes(c.id) });
        if (out[c.id]) pin(ctx, out[c.id].top.x, out[c.id].top.y + 24);
      }
    });
    return out;
  }

  // ---------------------------------------------------------------------------
  // Schematic and paper pieces for act 2
  // ---------------------------------------------------------------------------

  /** G2: progress ring, 5 arcs, arc k lit; a = fade-in alpha. */
  function progress(ctx, k, a = 1) {
    const cx = 900, cy = 300, r = 46, gap = (10 * Math.PI) / 180;
    const seg = (Math.PI * 2) / 5;
    ctx.save();
    ctx.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
      const a0 = -Math.PI / 2 + i * seg + gap / 2, a1 = a0 + seg - gap;
      ctx.strokeStyle = i === k ? P.schemOk : i < k ? L.rgba(P.schemOk, 0.45 * a) : L.rgba(P.lavender, 0.3 * a);
      ctx.globalAlpha = i === k ? a : 1;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(cx, cy, r, a0, a1);
      ctx.stroke();
    }
    ctx.restore();
    L.ticks(ctx, cx, cy, { r: r + 10, n: 20, len: 6, color: P.lineWhite, alpha: 0.35 * a });
  }

  /** Schematic phone: double lavender outline. */
  function phoneSchem(ctx, cx, cy, w, h, draw = 1, seed = 1) {
    const pts = L.rrectPts(cx - w / 2, cy - h / 2, w, h, 56, 18);
    L.inkPath(ctx, pts, { closed: true, width: 2.5, color: P.lavender, alpha: 0.85, draw, seed, double: { offset: 9, width: 1.5, alpha: 0.5, from: 0, to: 1 } });
    if (draw >= 1) {
      L.inkPath(ctx, L.rrectPts(cx - 60, cy - h / 2 + 22, 120, 14, 7, 8), { closed: true, width: 1.5, color: P.lavender, alpha: 0.6, seed: seed + 3 });
    }
  }

  /** Ink phone on paper with a white screen; returns the screen rect. */
  function phoneInk(ctx, cx, cy, w, h, seed = 1, T = 0) {
    const bi = L.boil(T);
    const body = L.rrectPts(cx - w / 2, cy - h / 2, w, h, 64, 16);
    ctx.save();
    ctx.translate(14, 18);
    ctx.fillStyle = L.rgba(P.ink, 0.18);
    poly(ctx, body);
    ctx.fill();
    ctx.restore();
    L.inkPath(ctx, body, { closed: true, width: 5, color: P.ink, fill: P.ink, seed, boil: bi });
    const sx = cx - w / 2 + 26, sy = cy - h / 2 + 70, sw = w - 52, sh = h - 140;
    L.inkPath(ctx, L.rrectPts(sx, sy, sw, sh, 30, 16), { closed: true, width: 2, color: P.ink, fill: P.screen, seed: seed + 1, boil: bi });
    return { x: sx, y: sy, w: sw, h: sh };
  }

  /** Hand-drawn ellipse around a box {x, y, w, h, rot}, drawn on by p (0..1). */
  function ringBox(ctx, box, p, color, seed = 1, T = 0, pad = 26) {
    if (p <= 0) return;
    const pts = L.ellipsePts(box.x, box.y, box.w / 2 + pad, box.h / 2 + pad * 0.55, 72, box.rot || 0);
    L.inkPath(ctx, pts, { closed: false, width: 4.5, color, draw: p, seed, boil: L.boil(T), wobble: 3 });
  }

  function label(ctx, str, x, y, o = {}) {
    L.text(ctx, str, x, y, Object.assign({ size: 30, weight: 500, color: P.lavender, family: SANS }, o));
  }

  FILM.cast = Object.freeze({ BOARD, CLIPS, BYID, SERIF, SANS, wrap, clipping, board, boardBase, pin, slapScale, progress, phoneSchem, phoneInk, label, poly, ringBox });
})();

// ---- src\scenes\01-crecida.js
// 01 crecida: T 0 to 2. Layers: board (C1 in full text) > red ring around "200 evacuados" > stamp HOY.
(function () {
  'use strict';
  const ID = 'crecida';
  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal, C = FILM.cast, E = L.ease;
      const t = Math.max(0, Math.min(tIn, info.dur)), T = info.shot.start + t;
      const zoom = 1 + 0.03 * E.inOutSine(t / info.dur);
      const cam = { x: 540, y: 880, zoom };
      const clips = C.board(ctx, T, cam, ['C1']);
      const c1 = clips.C1;
      // 1. ring around the line with "evacuados" (T 0.5, draw-on over 6 frames)
      const idx = Math.max(0, c1.lines.findIndex((s) => s.includes('evacuados')));
      const ring = L.seg(t, 0.5 - 1 / 24, 0.5 + 5 / 24, 'outExpo');
      L.camera(ctx, cam, () => C.ringBox(ctx, c1.lineBox(idx), ring, P.pinRed, 11, T));
      // 2. stamp HOY (T 1.0, pop on the beat)
      if (t >= 1.0 - 1e-6) {
        const u = Math.min(1, (t - 1.0) / (3 / 24) + 1 / 3);
        const s = 1 + 0.35 * (1 - E.outBack(u));
        ctx.save();
        ctx.translate(820, 1230);
        ctx.rotate(-0.14);
        ctx.scale(s, s);
        L.inkPath(ctx, L.rrectPts(-120, -58, 240, 116, 14, 12), { closed: true, width: 6, color: P.pinRed, seed: 21, boil: L.boil(T) });
        L.text(ctx, 'HOY', 0, 26, { size: 76, weight: 900, color: P.pinRed, family: C.SANS, align: 'center', tracking: 6 });
        ctx.restore();
      }
    },
  });
})();

</script>

      L.inkPath(ctx, SHAPE, { closed: true, width: 5, color: P.ink, fill: L.mix(P.sage, P.paper, 0.45), seed: 142, boil: bi });
      L.hatch(ctx, SHAPE, { spacing: 12, angle: Math.PI / 4, color: P.ink, alpha: 0.18, seed: 143, bounds: [250, 470, 650, 950] });
      // Paraná along north and west, Uruguay along the east
      L.inkPath(ctx, [[120, 380], [300, 430], [480, 420], [700, 410], [840, 400]], { width: 14, color: P.teal, alpha: 0.85, seed: 144, boil: bi });
      L.inkPath(ctx, [[150, 420], [200, 700], [180, 1000], [230, 1350]], { width: 14, color: P.teal, alpha: 0.85, seed: 145, boil: bi });
      L.inkPath(ctx, [[960, 560], [970, 850], [900, 1150], [760, 1450]], { width: 12, color: P.teal, alpha: 0.7, seed: 146, boil: bi });
      L.text(ctx, 'río Paraná', 520, 385, { size: 30, weight: 600, color: P.tealDeep, family: C.SANS, italic: true });
      L.text(ctx, 'río Uruguay', 900, 1240, { size: 28, weight: 600, color: P.tealDeep, family: C.SANS, italic: true, align: 'right' });
      // pins on the beats
      for (const p of PINS) {
        if (t < p.at - 1e-6) continue;
        const u = Math.min(1, (t - p.at) / (3 / 24) + 1 / 3);
        const s = 1 + 0.4 * (1 - E.outBack(u));
        C.pin(ctx, p.x, p.y, 1.3 * s);
        L.text(ctx, p.name, p.x + 34, p.y + 12, { size: 38, weight: 800, color: P.ink, family: C.SANS });
      }
      const r = L.seg(t, 1.5 - 1 / 24, 1.5 + 7 / 24, 'outExpo');
      if (r > 0) L.inkCircle(ctx, 380, 600, 230, { ry: 170, width: 4, color: P.annYellow, draw: r, seed: 147 });
      L.text(ctx, 'Primeras colectas piloto', 540, 1500, { size: 44, weight: 800, color: P.ink, family: C.SANS, align: 'center', alpha: L.seg(t, 1.5, 1.8) });
      L.text(ctx, 'esquema, no a escala', 940, 300, { size: 22, color: P.inkSoft, family: C.SANS, align: 'right' });
    },
  });
})();
